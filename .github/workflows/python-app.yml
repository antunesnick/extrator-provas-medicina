name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # Um push novo na mesma branch cancela a execução anterior.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Qt sem servidor gráfico: obrigatório para os testes de View no runner.
  QT_QPA_PLATFORM: offscreen

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint e tipagem — falha rápido e barato, antes de gastar tempo com testes.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # A partir do requirements-dev, e não de pinos repetidos aqui: duas listas
      # de versões divergem no primeiro esquecimento, e a divergência aparece
      # como "black reprovou um arquivo que o black local aprovou".
      - name: Instalar ferramentas de qualidade
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint + ordenação de imports)
        run: ruff check app scripts tests main.py

      - name: Black (verificação de formatação)
        run: black --check --diff app scripts tests main.py

      - name: Mypy (checagem de tipos)
        run: mypy app
        continue-on-error: true # ainda não bloqueante nesta fase do projeto

  # ---------------------------------------------------------------------------
  # 2. Testes — matriz de SO e versão de Python.
  #    As dependências de ML (torch/transformers, >2 GB) NÃO são instaladas:
  #    a suíte usa dublês para o classificador. Isso mantém o CI em minutos.
  # ---------------------------------------------------------------------------
  testes:
    name: Testes (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar suporte a FTS5 no SQLite
        shell: bash
        run: python -c "from app.models.database import fts5_disponivel; assert fts5_disponivel(), 'SQLite sem FTS5'"

      - name: Criar banco do zero (valida as migrations)
        run: python scripts/init_db.py --db "${{ runner.temp }}/ci.db" --reset --seed

      # Sobe o app sem GUI: pega erro de import e de migration que a suíte de
      # testes não pegaria, porque ela nunca passa pelo ponto de entrada real.
      - name: Verificar a inicialização do aplicativo
        env:
          EXTRATOR_DB_PATH: ${{ runner.temp }}/smoke.db
        run: python main.py --sem-gui

      - name: Rodar a suíte de testes
        run: >
          pytest
          --cov=app
          --cov-report=xml
          --cov-report=term-missing
          --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}.xml
          -v

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit-*.xml
          if-no-files-found: ignore

      - name: Enviar cobertura ao Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

# ---------------------------------------------------------------------------
# Havia aqui um terceiro estágio, "Testes do pipeline de ML". Ele foi removido
# na primeira vez que chegou a rodar de verdade — o job só disparava em `main`,
# e este repositório não teve `main` até hoje.
#
# O que ele fazia, medido no log: instalava torch e transformers (~2 min),
# baixava um modelo do spaCy que NÃO é dependência do projeto (a própria
# `requirements-ml.txt` registra a remoção do spaCy, "nenhuma etapa usa
# sentencização ou NER") e, ao final, rodava `pytest -m ml` — que coleta
# **zero testes**, porque nenhum teste do projeto usa esse marcador.
#
# Ou seja: gastava minutos de CI para falhar num passo obsoleto antes de não
# testar nada. O marcador `ml` continua declarado no pyproject; quando existir
# um teste que realmente carregue transformers, o estágio volta — junto com o
# teste que lhe dá motivo.
